        //traditional function expression
        const squareES5 = function (x) {
            return x * x;
        }
        console.log(squareES5(4));

        //arrow function (ES6+) - explicit return
        const squareES6 = (x) => {
            return x * x;
        }
        console.log(squareES6(2));

        // const squareES6Implicit (ES6+) - IMPLICIT return
        const squareES6Implicit = (x) => x * x;
